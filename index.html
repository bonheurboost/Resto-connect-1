<!doctype html>
<html lang="fr" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RestoConnect — La gestion intelligente de votre restaurant</title>
    <meta name="description" content="Plateforme SaaS multi-tenant de gestion et de digitalisation des restaurants en République démocratique du Congo." />
    <meta property="og:title" content="RestoConnect — La gestion intelligente de votre restaurant" />
    <meta property="og:description" content="Plateforme SaaS multi-tenant de gestion et de digitalisation des restaurants en République démocratique du Congo." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('restoconnect_theme_v1');
          var resolved = 'dark';
          if (pref === 'light') {
            resolved = 'light';
          } else if (pref === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          if (resolved === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          root.setAttribute('data-theme', resolved);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
